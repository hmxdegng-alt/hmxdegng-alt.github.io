
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
canvas{display:block}
#settingsBtn{
  position:fixed;bottom:18px;right:18px;z-index:100;
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,255,65,0.12);border:1px solid rgba(0,255,65,0.4);
  color:#0f0;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
#settingsBtn:hover{background:rgba(0,255,65,0.22)}
#hint{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  color:rgba(0,255,65,0.35);font:11px/1 monospace;letter-spacing:2px;
  pointer-events:none;transition:opacity 0.6s;
}
#panel{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(3,8,3,0.97);border:1px solid rgba(0,255,65,0.25);
  border-radius:14px;padding:22px 24px;width:310px;
  display:none;z-index:200;font-family:monospace;
}
#panel.open{display:block}
#panel h3{color:#0f0;font-size:11px;letter-spacing:3px;margin-bottom:18px}
.sec{color:#060;font-size:10px;letter-spacing:2px;margin:16px 0 8px;
  border-top:1px solid rgba(0,255,65,0.1);padding-top:10px}
.row{margin-bottom:12px}
.row label{display:flex;justify-content:space-between;color:#0b0;font-size:10px;letter-spacing:1px;margin-bottom:5px}
.row label span{color:#0f0;font-weight:bold}
input[type=range]{width:100%;accent-color:#0f0;cursor:pointer}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.cpick{display:flex;flex-direction:column;gap:3px}
.cpick label{font-size:10px;color:#080;letter-spacing:1px}
.cpick input{width:100%;height:28px;border:1px solid rgba(0,255,65,0.2);border-radius:5px;cursor:pointer;background:transparent;padding:2px}
select{width:100%;background:rgba(0,255,65,0.04);border:1px solid rgba(0,255,65,0.25);color:#0f0;padding:5px 7px;border-radius:6px;font-family:monospace;font-size:10px;cursor:pointer}
select option{background:#030803}
.close-btn{width:100%;margin-top:14px;padding:7px;background:rgba(0,255,65,0.08);border:1px solid rgba(0,255,65,0.35);color:#0f0;border-radius:7px;cursor:pointer;font-family:monospace;font-size:10px;letter-spacing:2px}
.close-btn:hover{background:rgba(0,255,65,0.18)}
</style>

<canvas id="c"></canvas>
<span id="hint">ESPACIO · pausar generación</span>
<button id="settingsBtn" aria-label="Configuración"><i class="ti ti-settings"></i></button>

<div id="panel">
  <h3>◈ MATRIX CONFIG</h3>

  <div class="sec">COLORES</div>
  <div class="cgrid">
    <div class="cpick"><label>Trazo</label><input type="color" id="cChar" value="#00ff41"></div>
    <div class="cpick"><label>Cabeza</label><input type="color" id="cHead" value="#ccffcc"></div>
    <div class="cpick"><label>Fondo</label><input type="color" id="cBg" value="#000000"></div>
    <div class="cpick"><label>Glow</label><input type="color" id="cGlow" value="#00ff41"></div>
  </div>

  <div class="sec">ZOOM</div>
  <div class="row">
    <label>Tamaño fuente <span id="vFs">16px</span></label>
    <input type="range" id="rFs" min="4" max="72" value="16" step="1">
  </div>

  <div class="sec">VELOCIDAD</div>
  <div class="row">
    <label>Caída (frames/paso) <span id="vSp">3</span></label>
    <input type="range" id="rSp" min="1" max="20" value="3" step="1">
  </div>
  <div class="row">
    <label>Fade (opacidad bg) <span id="vFd">0.05</span></label>
    <input type="range" id="rFd" min="1" max="40" value="5" step="1">
  </div>

  <div class="sec">DENSIDAD</div>
  <div class="row">
    <label>Columnas activas <span id="vDn">60%</span></label>
    <input type="range" id="rDn" min="5" max="100" value="60" step="5">
  </div>

  <div class="sec">DIRECCIÓN</div>
  <div class="row">
    <select id="selDir">
      <option value="down">↓ Abajo</option>
      <option value="up">↑ Arriba</option>
      <option value="left">← Izquierda</option>
      <option value="right">→ Derecha</option>
    </select>
  </div>

  <div class="sec">CHARSET</div>
  <div class="row">
    <select id="selCs">
      <option value="katakana">Katakana (Matrix)</option>
      <option value="binary">Binario</option>
      <option value="latin">Latin + símbolos</option>
      <option value="arabic">Árabe</option>
      <option value="mixed">Mezclado</option>
    </select>
  </div>

  <button class="close-btn" id="closeBtn">CERRAR ✕</button>
</div>

<script>
const CHARSETS = {
  katakana:'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンァィゥェォ',
  binary:'01',
  latin:'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!?><|/',
  arabic:'ابتثجحخدذرزسشصضطظعغفقكلمنهوي',
  mixed:'アイウカキクサシスタチツ01ABCDEFGHabcdefgh@#$%ابتثجحخ'
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let cfg = {
  fs: 16, charColor:'#00ff41', headColor:'#ccffcc',
  bgColor:'#000000', glowColor:'#00ff41',
  framesPerStep: 3, fadeAlpha: 0.05,
  density: 0.6, dir:'down', charset:'katakana',
  paused: false
};

let drops = [];
let frameCount = 0;

function hex2rgb(h){
  return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
}

function rndChar(){
  const s=CHARSETS[cfg.charset];
  return s[Math.floor(Math.random()*s.length)];
}

function initDrops(){
  const fs=cfg.fs;
  const isH=(cfg.dir==='left'||cfg.dir==='right');
  const lanes=Math.ceil((isH?canvas.height:canvas.width)/fs)+1;
  drops=[];
  for(let i=0;i<lanes;i++){
    drops.push({
      active: Math.random()<cfg.density,
      y: Math.random()<0.5 ? Math.floor(Math.random()*((isH?canvas.width:canvas.height)/fs))*-1 : 0,
      speed: 1,
      resetChance: 0.975
    });
  }
}

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  initDrops();
}

function draw(){
  requestAnimationFrame(draw);
  frameCount++;

  const fs=cfg.fs;
  const [br,bg,bb]=hex2rgb(cfg.bgColor);
  const [cr,cg,cb]=hex2rgb(cfg.charColor);
  const [hr,hg,hb]=hex2rgb(cfg.headColor);
  const isH=(cfg.dir==='left'||cfg.dir==='right');
  const totalLen=(isH?canvas.width:canvas.height)/fs;

  // fade overlay — runs every frame for smooth fade regardless of step speed
  ctx.fillStyle=`rgba(${br},${bg},${bb},${cfg.fadeAlpha})`;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.font=`${fs}px monospace`;

  const doStep=(frameCount%cfg.framesPerStep===0);

  for(let i=0;i<drops.length;i++){
    const d=drops[i];
    if(!d.active) continue;

    const lane=i*fs+fs/2;
    const pos=d.y;

    // Draw head char at current position
    if(pos>=0 && pos<totalLen){
      let x,y;
      if(cfg.dir==='down'){x=i*fs;y=pos*fs;}
      else if(cfg.dir==='up'){x=i*fs;y=canvas.height-pos*fs-fs;}
      else if(cfg.dir==='right'){x=pos*fs;y=i*fs;}
      else{x=canvas.width-pos*fs-fs;y=i*fs;}

      ctx.shadowColor=cfg.glowColor;
      ctx.shadowBlur=8;
      ctx.fillStyle=`rgb(${hr},${hg},${hb})`;
      ctx.fillText(rndChar(),x,y+fs);
      ctx.shadowBlur=0;
    }

    if(doStep && !cfg.paused){
      d.y++;
      // reset column when it's gone past the bottom
      if(d.y*fs>=(isH?canvas.width:canvas.height)+fs){
        if(Math.random()>d.resetChance){
          d.y=0;
          // re-evaluate if this lane should be active based on density
          d.active=Math.random()<cfg.density;
        }
      }
    }
  }
}

// Panel wiring
document.getElementById('settingsBtn').onclick=()=>document.getElementById('panel').classList.toggle('open');
document.getElementById('closeBtn').onclick=()=>document.getElementById('panel').classList.remove('open');

function bind(id,key,transform,dispId,dispFn,reinit){
  const el=document.getElementById(id);
  el.addEventListener('input',()=>{
    cfg[key]=transform?transform(el.value):el.value;
    if(dispId) document.getElementById(dispId).textContent=dispFn?dispFn(el.value):el.value;
    if(reinit) initDrops();
  });
}

bind('rFs','fs',v=>parseInt(v),'vFs',v=>v+'px',true);
bind('rSp','framesPerStep',v=>parseInt(v),'vSp',v=>v);
bind('rFd','fadeAlpha',v=>v/100,'vFd',v=>(v/100).toFixed(2));
bind('rDn','density',v=>v/100,'vDn',v=>v+'%',true);
bind('cChar','charColor',null);
bind('cHead','headColor',null);
bind('cBg','bgColor',null);
bind('cGlow','glowColor',null);
bind('selDir','dir',null,null,null,true);
bind('selCs','charset',null);

window.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    cfg.paused=!cfg.paused;
    const h=document.getElementById('hint');
    h.textContent=cfg.paused?'PAUSADO — ESPACIO para continuar':'ESPACIO · pausar generación';
    h.style.opacity=cfg.paused?'0.9':'0.35';
  }
});

window.addEventListener('resize',resize);

setTimeout(()=>{document.getElementById('hint').style.opacity='0.2';},4000);

resize();
draw();
</script>
